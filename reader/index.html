<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paper Shelf — 논문 이북 리더</title>
  <meta name="theme-color" content="#1f2430">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/pdf.min.js"></script>
</head>
<body>

  <!-- ===== 서재 화면 ===== -->
  <main id="libraryView" class="view">
    <header class="lib-header">
      <h1>📚 Paper Shelf</h1>
      <label class="btn btn-primary" for="fileInput">+ PDF 추가</label>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
    </header>
    <p class="lib-hint" id="libHint">논문 PDF를 추가하면 전자책처럼 읽을 수 있어요.</p>
    <div id="bookGrid" class="book-grid"></div>
  </main>

  <!-- ===== 리더 화면 ===== -->
  <section id="readerView" class="view" hidden>
    <div id="progressBar"><div id="progressFill"></div></div>
    <header class="reader-topbar">
      <button id="backBtn" class="icon-btn" title="서재로">←</button>
      <span id="readerTitle" class="reader-title"></span>
      <span id="progressLabel" class="progress-label"></span>
      <button id="fontDownBtn" class="icon-btn" title="글자 작게">A−</button>
      <button id="fontUpBtn" class="icon-btn" title="글자 크게">A＋</button>
      <button id="hlListBtn" class="icon-btn" title="하이라이트 목록">🖍</button>
    </header>
    <article id="readerContent" class="reader-content"></article>
  </section>

  <!-- 하이라이트 목록 패널 -->
  <aside id="hlPanel" class="hl-panel" hidden>
    <div class="hl-panel-head">
      <strong>하이라이트 · 메모</strong>
      <button id="hlPanelClose" class="icon-btn">✕</button>
    </div>
    <div id="hlPanelList"></div>
  </aside>

  <!-- 텍스트 선택 메뉴 -->
  <div id="selMenu" class="popup" hidden>
    <button id="selHighlight">🖍 하이라이트</button>
    <button id="selMemo">📝 메모</button>
  </div>

  <!-- 메모 편집 팝업 -->
  <div id="notePopup" class="popup note-popup" hidden>
    <blockquote id="noteQuote"></blockquote>
    <textarea id="noteText" rows="3" placeholder="메모를 입력하세요…"></textarea>
    <div class="note-actions">
      <button id="noteDelete" class="btn btn-danger">삭제</button>
      <button id="noteSave" class="btn btn-primary">저장</button>
    </div>
  </div>

  <!-- 추출 진행 오버레이 -->
  <div id="extractOverlay" class="overlay" hidden>
    <div class="overlay-box">
      <div class="spinner"></div>
      <p id="extractMsg">PDF 분석 중…</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
