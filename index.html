<!DOCTYPE html>
<html lang="ko" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paper Shelf</title>
  <meta name="theme-color" id="themeColorMeta" content="#F2E8D5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/pdf.min.js"></script>
</head>
<body>

  <!-- ===== 서재 ===== -->
  <main id="libraryView" class="view">
    <header class="lib-header">
      <div class="lib-brand">Paper Shelf</div>
      <div class="lib-actions">
        <button id="libThemeBtn" class="theme-cycle-btn" title="테마 변경">📖</button>
        <button id="einkBtn" class="theme-cycle-btn" title="e-ink 모드" style="font-size:15px;letter-spacing:-0.5px">E</button>
        <label class="btn-add" for="fileInput">+ PDF 추가</label>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>
    </header>
    <p class="lib-hint" id="libHint">논문 PDF를 추가하면 전자책처럼 읽을 수 있어요.</p>
    <div id="bookGrid" class="book-grid"></div>
  </main>

  <!-- ===== 리더 ===== -->
  <section id="readerView" class="view ui-on" hidden>

    <!-- 상단 바 (자동 숨김) -->
    <header class="reader-topbar reader-ui">
      <button id="backBtn" class="tb-icon-btn" aria-label="서재로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span id="readerTitle" class="reader-title-text"></span>
    </header>

    <!-- 본문 -->
    <article id="readerContent" class="reader-content"></article>

    <!-- 글자 크기 패널 (툴바 위) -->
    <div id="fontPanel" class="above-tb-panel" hidden>
      <button id="fontDownBtn" class="font-adj-btn">A−</button>
      <div id="fontDots" class="font-dots">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <button id="fontUpBtn" class="font-adj-btn">A＋</button>
    </div>

    <!-- 테마 패널 (툴바 위) -->
    <div id="themePanel" class="above-tb-panel theme-panel" hidden>
      <button class="theme-chip" data-t="light">Light</button>
      <button class="theme-chip" data-t="sepia">Sepia</button>
      <button class="theme-chip" data-t="dark">Dark</button>
    </div>

    <!-- 하단 툴바 (자동 숨김) -->
    <nav class="reader-toolbar reader-ui">
      <button id="fontBtn"      class="tb-btn" aria-label="글자 크기"><span class="tb-label">Aa</span></button>
      <button id="themePickBtn" class="tb-btn" aria-label="테마"><span id="themePickIcon">📖</span></button>
      <button id="ttsBtn"       class="tb-btn" aria-label="읽어주기">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3.5 8.5h3.5l4.5-3v11L7 14H3.5v-5.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M15 7.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M17.5 5a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="xlParaBtn"    class="tb-btn" aria-label="번역">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3 6h9M8 4v2M3 6c0 3.6 3 6.5 6.5 6.5M10 12.5c-1.3 0-2.5-.4-3.5-1.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M12 6h7M15.5 4v2M21 16l-5.5-5.5M15.5 10.5c0 3.6-3 6.5-6.5 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="hlListBtn"    class="tb-btn" aria-label="하이라이트">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="2.5" y="10" width="17" height="3.5" rx="1.75" fill="var(--hl-solid)" opacity=".85"/>
          <path d="M2.5 5.5h17M2.5 17h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

    <!-- 진행률 (항상 표시) -->
    <div class="reader-progress-wrap">
      <span id="progressLabel" class="progress-pct reader-ui"></span>
      <div class="reader-progress-bar">
        <div id="progressFill" class="reader-progress-fill"></div>
      </div>
    </div>

  </section>

  <!-- TTS 플레이어 바 -->
  <div id="ttsBar" class="tts-bar" hidden>
    <div class="tts-info">
      <div class="tts-wave"><span></span><span></span><span></span><span></span></div>
      <p id="ttsText" class="tts-text"></p>
    </div>
    <div class="tts-controls">
      <button id="ttsPrevBtn" class="icon-btn" aria-label="이전">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 3.5v11M15 3.5L7 9l8 5.5V3.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="ttsPauseBtn" class="tts-play-btn">
        <svg id="ttsPlayIcon"  width="18" height="18" viewBox="0 0 18 18"><path d="M5 3.5l10 5.5-10 5.5V3.5z" fill="currentColor"/></svg>
        <svg id="ttsPauseIcon" width="18" height="18" viewBox="0 0 18 18" hidden><rect x="3.5" y="3" width="3.5" height="12" rx="1.5" fill="currentColor"/><rect x="11" y="3" width="3.5" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button id="ttsNextBtn" class="icon-btn" aria-label="다음">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15 3.5v11M3 3.5l8 5.5-8 5.5V3.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="ttsRateBtn" class="tts-rate-btn">1.0×</button>
      <button id="ttsStopBtn" class="icon-btn" aria-label="정지">
        <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- 하이라이트 패널 -->
  <aside id="hlPanel" class="side-panel" hidden>
    <div class="panel-head">
      <strong>하이라이트 · 메모</strong>
      <button id="hlPanelClose" class="icon-btn">✕</button>
    </div>
    <div id="hlPanelList" class="panel-list"></div>
  </aside>

  <!-- 선택 메뉴 -->
  <div id="selMenu" class="sel-menu" hidden>
    <button id="selHighlight">🖍 하이라이트</button>
    <div class="sel-sep"></div>
    <button id="selMemo">📝 메모</button>
    <div class="sel-sep"></div>
    <button id="selTranslate">🌐 번역</button>
  </div>

  <!-- 메모 팝업 -->
  <div id="notePopup" class="float-popup note-popup" hidden>
    <blockquote id="noteQuote"></blockquote>
    <textarea id="noteText" rows="3" placeholder="메모를 입력하세요…"></textarea>
    <div class="note-actions">
      <button id="noteDelete" class="btn btn-danger">삭제</button>
      <button id="noteSave"   class="btn btn-primary">저장</button>
    </div>
  </div>

  <!-- 번역 바텀 시트 -->
  <div id="xlOverlay" class="sheet-overlay" hidden></div>
  <div id="xlSheet" class="bottom-sheet" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span id="xlLangBadge" class="lang-badge">EN → KO</span>
      <button id="xlClose" class="icon-btn">✕</button>
    </div>
    <div class="xl-original" id="xlOriginal"></div>
    <div class="xl-arrow">↓</div>
    <div class="xl-result-wrap">
      <div id="xlSpinner" class="spinner sm-spinner"></div>
      <p id="xlText" class="xl-text" hidden></p>
    </div>
    <div class="sheet-actions" id="xlActions" hidden>
      <button id="xlCopy" class="btn btn-outline">복사</button>
      <button id="xlMemo" class="btn btn-primary">메모로 저장</button>
    </div>
  </div>

  <!-- 로딩 오버레이 -->
  <div id="extractOverlay" class="overlay" hidden>
    <div class="overlay-box">
      <div class="spinner"></div>
      <p id="extractMsg">PDF 분석 중…</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
