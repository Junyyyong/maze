<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 배틀 메이즈</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="setup-screen" class="screen">
        <h1 class="glitch" data-text="NEON MAZE">NEON MAZE</h1>
        <p class="subtitle">마지막까지 살아남는 자가 승리(또는 패배)합니다.</p>
        
        <div class="setup-container">
            <div class="input-group">
                <label>참가 인원</label>
                <div class="player-count-control">
                    <button type="button" onclick="adjustPlayerCount(-1)">-</button>
                    <input type="number" id="player-count" value="4" min="2" max="8" readonly>
                    <button type="button" onclick="adjustPlayerCount(1)">+</button>
                </div>
            </div>

            <div id="player-list-setup" class="player-grid">
                <!-- 플레이어 설정 슬롯이 여기에 동적으로 생성됨 -->
            </div>

            <div class="settings">
                <label>미로 복잡도</label>
                <input type="range" id="difficulty" min="10" max="30" value="20">
            </div>

            <button id="start-btn" class="cyber-btn">SYSTEM INITIALIZE</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="header">
            <div class="status-bar">
                <span>STATUS: <b id="game-message">RACING...</b></span>
            </div>
        </div>

        <div class="game-layout">
            <div class="canvas-container">
                <canvas id="maze-canvas"></canvas>
            </div>
            
            <div class="sidebar">
                <div class="panel">
                    <h3>⚡ RUNNERS STATUS</h3>
                    <ul id="active-list"></ul>
                </div>
                <div class="panel">
                    <h3>🏁 FINISH LINE</h3>
                    <ul id="finished-list"></ul>
                </div>
                <div class="panel log-panel" id="log-panel"></div>
            </div>
        </div>
        
        <button id="restart-btn" class="cyber-btn hidden">REBOOT</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
