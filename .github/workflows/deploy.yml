name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/pdf-ebook-viewer-app-xsfz3b]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          # Flutter app 폴더와 불필요한 파일은 배포에서 제외
          clean-exclude: |
            app
            .github
          single-commit: true
